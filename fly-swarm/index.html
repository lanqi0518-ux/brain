<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>永生蜂群 · Immortal Fly Swarm</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<canvas id="swarm"></canvas>

<div class="hud">
  <div class="brand">
    <span class="dot"></span>
    <span>永生蜂群 · IMMORTAL SWARM</span>
  </div>
  <div class="sub">灵感来源：Google Research × HHMI Janelia · 成年雄性果蝇全脑连接组</div>
</div>

<div class="panel">
  <div class="row">
    <label>合约地址 <span class="hint">(EVM / Solana，可选)</span></label>
    <div class="input-row">
      <input id="ca" placeholder="0x... 或 Solana mint" spellcheck="false" />
      <button id="fetchBtn">拉取市值</button>
    </div>
  </div>

  <div class="row">
    <label>市值 (USD)</label>
    <input id="mcap" type="number" min="0" step="1000" value="100000" />
  </div>

  <div class="row toggles">
    <button id="playBtn" class="primary">▮▮ 暂停</button>
    <button id="resetBtn">↺ 重置</button>
    <button id="feedBtn">✦ 补食</button>
  </div>

  <div class="stats">
    <div><span class="k">种群</span><span class="v" id="stPop">1</span></div>
    <div><span class="k">世代</span><span class="v" id="stGen">1</span></div>
    <div><span class="k">食物</span><span class="v" id="stFood">0</span></div>
    <div><span class="k">蜂后</span><span class="v" id="stQueens">1</span></div>
    <div><span class="k">卵</span><span class="v" id="stEggs">0</span></div>
    <div><span class="k">市值</span><span class="v" id="stMcap">$0</span></div>
  </div>

  <div class="foot">
    食物容量 = √(市值/1000)。蜂后每 <span id="matePeriod">6</span>s 交配一次消耗食物产卵，卵孵化为幼虫再成虫。
    个体不会死亡——只在无食时休眠，直到再次进食。
  </div>
</div>

<div class="legend">
  <div><i class="sw queen"></i>蜂后</div>
  <div><i class="sw worker"></i>工蜂</div>
  <div><i class="sw egg"></i>卵/幼虫</div>
  <div><i class="sw food"></i>食物</div>
</div>

<script src="swarm.js"></script>
</body>
</html>
